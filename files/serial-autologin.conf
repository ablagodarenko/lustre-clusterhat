# Log the first regular user (uid 1000, created on first boot) in on the
# serial console without a password; root if there is no such user yet.
[Service]
ExecStart=
ExecStart=-/bin/sh -c 'exec /sbin/agetty --autologin "$$(id -nu 1000 2>/dev/null || echo root)" --keep-baud 115200,57600,38400,9600 - "$${TERM:-vt220}"'
